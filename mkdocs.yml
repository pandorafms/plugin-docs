site_name: Pandora FMS Guides
site_url: https://docs.pandorafms.com/integrations/
repo_url: https://github.com/pandorafms/plugin-docs
docs_dir: docs

hooks:
  - scripts/hooks.py

theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search
  - awesome-pages
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      auto_caption: false
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: es
          name: Español
          build: true

extra:
  version:
    provider: mike
    alias: true

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# nav: se genera automáticamente desde la estructura de docs/en (y docs/es)
# vía mkdocs-awesome-pages-plugin. El orden/títulos se controlan con
# ficheros .pages dentro de cada carpeta (ver docs/en/.pages).
