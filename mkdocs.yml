site_name: Pandora FMS Guides
site_url: https://pandorafms.com/docs/integrations/
repo_url: https://github.com/pandorafms/plugin-docs
docs_dir: docs

hooks:
  - scripts/hooks.py

theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search
  - awesome-pages
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      auto_caption: false
  - redirects:
      redirect_maps:
        'en/disco/pandorafms.aws.cloudwatch.md': 'en/discovery/amazon-cloudwatch.md'
        'en/disco/pandorafms.aws.ec2.md': 'en/discovery/amazon-ec2.md'
