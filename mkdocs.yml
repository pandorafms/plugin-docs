  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: es
          name: Español
          build: true

extra:
  version:
    provider: mike
    alias: true

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# nav: se genera automáticamente desde la estructura de docs/en (y docs/es)
# vía mkdocs-awesome-pages-plugin. El orden/títulos se controlan con
# ficheros .pages dentro de cada carpeta (ver docs/en/.pages).
