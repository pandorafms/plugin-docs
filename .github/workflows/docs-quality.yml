name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test documentation validator
        run: python3 -m unittest discover -s tests -p 'test_validate_docs.py'

      - name: Run blocking documentation gates
        run: python3 scripts/validate_docs.py --fail-on blocking

      - name: Install documentation dependencies
        run: pip install -r requirements.txt

      - name: Build documentation strictly
        run: mkdocs build --strict
